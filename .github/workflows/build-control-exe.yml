name: Build MCP Control EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop_control.py"
      - ".github/workflows/build-control-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MCP-Control desktop_control.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MCP-Control-Windows
          path: dist/MCP-Control.exe
          if-no-files-found: error
